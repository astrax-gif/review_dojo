services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dojo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dojo_change_me}
      POSTGRES_DB: review_dojo
    volumes:
      - dojo_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg2://dojo:${POSTGRES_PASSWORD:-dojo_change_me}@db:5432/review_dojo
      SECRET_KEY: ${SECRET_KEY:-change-this-secret}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  dojo_data:
